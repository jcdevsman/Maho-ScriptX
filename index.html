<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion. Modding made EASY</title>
    <style>
        :root {
            /* Apple-inspired dark mode palette with a blue tint */
            --bg-base: #000000;
            --bg-surface: #0a0e17; 
            --accent-blue: #2997ff; /* Signature Apple link/button blue */
            --accent-glow: #0a4b9c;
            --text-main: #f5f5f7;
            --text-muted: #86868b;
            --glass-bg: rgba(25, 33, 50, 0.4);
            --glass-border: rgba(255, 255, 255, 0.05);
        }

        body {
            /* System font stack targets Apple's San Francisco first */
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-base);
            /* Subtle blue ambient glow at the top */
            background-image: radial-gradient(circle at 50% -20%, var(--accent-glow) 0%, transparent 60%);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.47059;
            letter-spacing: -0.022em;
            -webkit-font-smoothing: antialiased;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-weight: 600;
            font-size: 21px;
            letter-spacing: -0.01em;
        }

        header {
            text-align: center;
            padding: 140px 20px 100px;
        }

        h1 {
            font-size: 80px;
            font-weight: 600;
            margin: 0 0 15px 0;
            letter-spacing: -0.015em;
        }

        p.subtitle {
            font-size: 24px;
            color: var(--text-muted);
            max-width: 700px;
            margin: 0 auto 40px;
            font-weight: 400;
            line-height: 1.3333;
        }

        .cta-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
        }

        .cta-button {
            display: inline-block;
            background-color: var(--accent-blue);
            color: #ffffff;
            padding: 12px 22px;
            font-size: 17px;
            font-weight: 400;
            text-decoration: none;
            border-radius: 980px; /* Perfect pill shape */
            transition: all 0.2s ease;
        }

        .cta-button:hover {
            background-color: #0077ed;
        }

        .cta-link {
            color: var(--accent-blue);
            font-size: 17px;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .cta-link:hover {
            text-decoration: underline;
        }

        .cta-link::after {
            content: ' ›';
            font-size: 1.2em;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px 80px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
        }

        .feature-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            transition: transform 0.3s ease;
        }

        .feature-card:hover {
            transform: scale(1.02);
        }

        .feature-icon {
            font-size: 32px;
            margin-bottom: 20px;
            color: var(--accent-blue);
        }

        .feature-card h3 {
            font-size: 21px;
            font-weight: 600;
            margin: 0 0 10px 0;
            color: var(--text-main);
        }

        .feature-card p {
            color: var(--text-muted);
            font-size: 17px;
            margin: 0;
            font-weight: 400;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-muted);
            font-size: 12px;
            border-top: 1px solid var(--glass-border);
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Orion</div>
    </nav>

    <header>
        <h1>Orion</h1>
        <p class="subtitle">Built by a modders, for the modders.</p>
        <div class="cta-container">
            <a href="https://cdn.discordapp.com/attachments/1424469562665074943/1497083812285382697/0.9.1.rar?ex=6a905e33&is=6a8f0cb3&hm=bd639d61dbc1a2f038c03b4a2584415549a70bfd94e0c60a4ea0ed5c06912bf8&" class="cta-button">Download</a>
        </div>
    </header>

    <div class="container">
        <div class="features">
            <div class="feature-card">
                <div class="feature-icon">O</div>
                <h3>Optimized workspace</h3>
                <p>Interface made for heavly workflow.</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon">RI</div>
                <h3>Resilient</h3>
                <p>After fail after fail, Orion is still a thing!</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon">ON</div>
                <h3>ON it..</h3>
                <p>Roblox updated? Orion is ON IT.</p>
            </div>
        </div>
    </div>

    <footer>
        <p>that's la peace.</p>
    </footer>

</body>
</html>
